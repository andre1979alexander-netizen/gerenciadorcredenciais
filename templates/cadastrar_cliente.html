{% extends 'base.html' %}

{% block title %}Cadastrar Cliente - ContábilSecure{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-dark text-white p-3">
                <h4 class="mb-0">Cadastrar Novo Cliente (Titular)</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('cadastrar_cliente') }}" method="POST">
                    <div class="mb-3">
                        <label for="nome_completo" class="form-label fw-semibold">Nome Completo *</label>
                        <input type="text" class="form-control" id="nome_completo" name="nome_completo" placeholder="Ex: João Silva de Souza" required>
                    </div>
                    <div class="mb-3">
                        <label for="cpf" class="form-label fw-semibold">CPF *</label>
                        <input type="text" class="form-control" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                    </div>
                    <div class="mb-4">
                        <label for="telefone" class="form-label fw-semibold">Telefone de Contato</label>
                        <input type="text" class="form-control" id="telefone" name="telefone" placeholder="Ex: (11) 99999-9999">
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('index') }}" class="text-secondary text-decoration-none">← Cancelar</a>
                        <button type="submit" class="btn btn-dark px-4">Cadastrar Cliente</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('cpf').addEventListener('input', function (e) {
    let value = e.target.value.replace(/\D/g, ''); // Remove tudo o que não for número
    if (value.length > 11) value = value.slice(0, 11); // Limita a 11 dígitos
    
    // Aplica a MileStone do CPF: 000.000.000-00
    if (value.length > 9) {
        value = value.replace(/^(\d{3})(\d{3})(\d{3})(\d{1,2})$/, '$1.$2.$3-$4');
    } else if (value.length > 6) {
        value = value.replace(/^(\d{3})(\d{3})(\d{1,3})$/, '$1.$2.$3');
    } else if (value.length > 3) {
        value = value.replace(/^(\d{3})(\d{1,3})$/, '$1.$2');
    }
    
    e.target.value = value;
});
</script>
{% endblock %}
